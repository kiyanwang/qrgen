  <text x="430" y="18" font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#565f89" text-anchor="middle">~/projects — zsh</text>
  <g font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="13" xml:space="preserve">
<text x="20" y="58"><tspan fill="#bb9af7">$</tspan> <tspan fill="#c0caf5">qrgen kiyanwang.github.io --style dots --eye-style circle -g &quot;#ff0080,#7928ca&quot;</tspan></text>
<text x="20" y="80" fill="#9ece6a">✔ Saved qrcode.png (1024×1024px, version 3, ECL M) → https://kiyanwang.github.io</text>
<text x="20" y="124"><tspan fill="#bb9af7">$</tspan> <tspan fill="#c0caf5">qrgen example.com --fg &quot;#cbd5e1&quot; -o pale.png</tspan></text>
<text x="20" y="146" fill="#e0af68">⚠ Low contrast between foreground and background (1.5:1). Many scanners need at least 3:1.</text>
