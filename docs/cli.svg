<text x="20" y="212"><tspan fill="#bb9af7">$</tspan> <tspan fill="#c0caf5">qrgen &quot;not a url&quot;</tspan></text>
<text x="20" y="234" fill="#f7768e">✖ Not a valid URL: &quot;not a url&quot; (use --raw to encode arbitrary text)</text>
